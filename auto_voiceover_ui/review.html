<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Auto Voiceover 逐句微调</title>
  <link rel="stylesheet" href="/ui/styles.css" />
  <link rel="stylesheet" href="/ui/review.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Auto Voiceover</p>
      <h1>章节逐句审听与微调</h1>
      <p class="subtitle">按章节试听当前音频，调整情绪并局部重配。</p>
    </div>
    <div class="header-actions">
      <a class="ghost" href="/emotion-recording">情感录制</a>
      <a class="ghost" href="/">返回主页</a>
    </div>
  </header>

  <main class="review-layout">
    <div class="review-main">
    <section class="card panel">
      <div class="panel-header">
        <div>
          <h2>基础信息</h2>
          <p class="muted">选择脚本/配置/输出目录后加载章节。</p>
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label>脚本 (.md)</label>
          <div class="field-input">
            <input id="scriptPath" type="text" />
            <button class="ghost" data-browse="script">浏览</button>
          </div>
        </div>
        <div class="field">
          <label>配置 (.yaml)</label>
          <div class="field-input">
            <input id="configPath" type="text" />
            <button class="ghost" data-browse="config">浏览</button>
          </div>
        </div>
        <div class="field">
          <label>输出根目录</label>
          <div class="field-input">
            <input id="outRoot" type="text" />
            <button class="ghost" data-browse="outroot">浏览</button>
          </div>
        </div>
        <div class="field">
          <label>模型目录</label>
          <div class="field-input">
            <input id="modelDir" type="text" />
            <button class="ghost" data-browse="model">浏览</button>
          </div>
        </div>
        <div class="field">
          <label>脚本语言</label>
          <select id="language">
            <option value="auto">自动</option>
            <option value="zh">中文</option>
            <option value="en">英文</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="loadChaptersBtn" class="primary">加载章节</button>
        <button id="clearCacheBtn" class="primary">清理模型缓存</button>
      </div>
    </section>

    <section class="card panel" id="chaptersPanel">
      <div class="panel-header spaced">
        <div>
          <h2>章节列表</h2>
          <p class="muted">点击右侧章节标签仅查看对应内容。</p>
        </div>
        <div id="chapterIndicator" class="muted"></div>
      </div>
      <div id="chaptersContainer" class="chapters"></div>
    </section>

    <!-- 字幕编辑区域 -->
    <section class="card panel" id="subtitleEditorPanel">
      <div class="panel-header spaced">
        <div>
          <h2>字幕编辑与导出</h2>
          <p class="muted">查看和修改字幕内容，生成准确的SRT字幕文件。</p>
        </div>
        <div class="subtitle-controls">
          <label class="checkbox-inline">
            <input type="checkbox" id="includeSpeaker" checked>
            包含说话人标签
          </label>
          <button id="generatePreviewBtn" class="btn btn-primary">
            📝 生成字幕预览
          </button>
          <button id="exportSrtBtn" class="btn btn-success" disabled>
            📥 导出SRT文件
          </button>
        </div>
      </div>

      <!-- 字幕预览表格 -->
      <div class="subtitle-preview-container" style="margin-top: 20px;">
        <div class="subtitle-stats" id="subtitleStats" style="margin-bottom: 15px; display: none;">
          <span class="badge">总时长: <span id="totalDuration">0</span>秒</span>
          <span class="badge">字幕条数: <span id="subtitleCount">0</span></span>
          <span class="badge" id="timingAccuracyBadge">⏱️ 时间准确性: 未验证</span>
        </div>

        <table class="subtitle-table" id="subtitleTable" style="display: none;">
          <thead>
            <tr>
              <th style="width: 5%">#</th>
              <th style="width: 15%">开始时间</th>
              <th style="width: 15%">结束时间</th>
              <th style="width: 50%">字幕内容</th>
              <th style="width: 15%">操作</th>
            </tr>
          </thead>
          <tbody id="subtitleTbody">
            <!-- 动态生成字幕行 -->
          </tbody>
        </table>

        <div id="subtitlePlaceholder" class="placeholder-text" style="text-align: center; padding: 40px; color: #666;">
          请先点击"生成字幕预览"按钮来生成字幕内容
        </div>
      </div>

      <!-- 时间线可视化 -->
      <div class="timeline-visualization" id="timelineVisualization" style="display: none; margin: 20px 0;">
        <div class="timeline-header" style="display: flex; justify-content: space-between; margin-bottom: 10px;">
          <span>时间线预览</span>
          <span id="timelinePosition">00:00</span>
        </div>
        <div class="timeline-bar" id="timelineBar" style="height: 30px; background: #e9ecef; border-radius: 4px; position: relative; overflow: hidden;">
          <!-- 动态生成时间片段 -->
        </div>
      </div>

      <!-- 批量编辑工具 -->
      <div class="batch-edit-tools" id="batchEditTools" style="display: none; margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px;">
        <h4>批量调整工具</h4>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button class="btn btn-sm btn-info" onclick="adjustAllTimings(-100)">
            ⏪ 整体提前100ms
          </button>
          <button class="btn btn-sm btn-info" onclick="adjustAllTimings(100)">
            ⏩ 整体延后100ms
          </button>
          <button class="btn btn-sm btn-warning" onclick="autoAdjustTiming()">
            🎯 自动调整时间间隔
          </button>
          <button class="btn btn-sm btn-secondary" onclick="resetToOriginal()">
            🔄 重置为原始字幕
          </button>
        </div>
      </div>

      <!-- 字幕格式选项 -->
      <div class="export-options" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px;">
        <h4>导出选项</h4>
        <div style="display: flex; gap: 20px; margin-top: 10px; align-items: center;">
          <label>
            <input type="radio" name="exportFormat" value="srt" checked> SRT格式
          </label>
          <label>
            <input type="radio" name="exportFormat" value="vtt"> WebVTT格式
          </label>
          <label>
            <input type="radio" name="exportFormat" value="txt"> 纯文本
          </label>
          <button id="exportFinalBtn" class="btn btn-success" disabled>
            📄 导出最终字幕
          </button>
        </div>
      </div>
    </section>
    </div>
    <aside class="chapter-nav" id="chapterNav">
      <h3>章节切换</h3>
      <div class="chapter-nav-list" id="chapterNavList"></div>
    </aside>
  </main>

  <div id="browserModal" class="modal hidden">
    <div class="modal-content">
      <header>
        <h3 id="browserTitle">浏览</h3>
        <button id="browserClose">×</button>
      </header>
      <div class="browser-toolbar">
        <span id="browserPath"></span>
        <button id="browserUp" class="secondary">上一级</button>
      </div>
      <ul id="browserList"></ul>
      <footer>
        <button id="browserCancel" class="secondary">取消</button>
        <button id="browserSelect" class="primary" disabled>选择</button>
      </footer>
    </div>
  </div>

  <script>window.__workspaceRoot = "";</script>
  <script src="/ui/review.js" type="module"></script>
</body>
</html>
