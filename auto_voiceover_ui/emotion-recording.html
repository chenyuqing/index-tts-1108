<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>情感参考音频录制 - Auto Voiceover</title>
  <link rel="stylesheet" href="/ui/styles.css" />
  <link rel="stylesheet" href="/ui/review.css" />
  <link rel="stylesheet" href="/ui/emotion-recording.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Auto Voiceover</p>
      <h1>情感参考音频录制</h1>
      <p class="subtitle">为每个片段录制情感参考音频，让配音更生动自然。</p>
    </div>
    <div class="header-actions">
      <a class="ghost" href="/emotion-recording">情感录制</a>
      <a class="ghost" href="/review">逐句微调</a>
      <a class="ghost" href="/">返回主页</a>
    </div>
  </header>

  <main class="review-layout">
    <div class="review-main">
    <section class="card panel">
      <div class="panel-header">
        <div>
          <h2>基础信息</h2>
          <p class="muted">选择脚本/配置/输出目录后加载章节。</p>
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label>脚本 (.md)</label>
          <div class="field-input">
            <input id="scriptPath" type="text" />
            <button class="ghost" data-browse="script">浏览</button>
          </div>
        </div>
        <div class="field">
          <label>配置 (.yaml)</label>
          <div class="field-input">
            <input id="configPath" type="text" />
            <button class="ghost" data-browse="config">浏览</button>
          </div>
        </div>
        <div class="field">
          <label>输出根目录</label>
          <div class="field-input">
            <input id="outRoot" type="text" />
            <button class="ghost" data-browse="outroot">浏览</button>
          </div>
        </div>
        <div class="field">
          <label>模型目录</label>
          <div class="field-input">
            <input id="modelDir" type="text" />
            <button class="ghost" data-browse="model">浏览</button>
          </div>
        </div>
        <div class="field">
          <label>脚本语言</label>
          <select id="language">
            <option value="auto">自动</option>
            <option value="zh">中文</option>
            <option value="en">英文</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="loadChaptersBtn" class="primary">加载章节</button>
        <button id="clearCacheBtn" class="primary">清理模型缓存</button>
      </div>
    </section>

    <section class="card panel" id="chaptersPanel">
      <div class="panel-header spaced">
        <div>
          <h2>章节列表</h2>
          <p class="muted">点击右侧章节标签仅查看对应内容。</p>
        </div>
        <div id="chapterIndicator" class="muted"></div>
      </div>
      <div id="chaptersContainer" class="chapters"></div>
    </section>

    <!-- 情感录制控制区域 -->
    <section class="card panel" id="emotionRecordingPanel">
      <div class="panel-header spaced">
        <div>
          <h2>情感录制控制</h2>
          <p class="muted">为当前片段录制情感参考音频，提升配音自然度。</p>
        </div>
        <div class="segment-controls">
          <button id="prevSegmentBtn" class="btn btn-secondary">⬅ 上一片段</button>
          <span id="segmentPosition" class="segment-position">0 / 0</span>
          <button id="nextSegmentBtn" class="btn btn-secondary">下一片段 ➡</button>
        </div>
      </div>

      <!-- 当前片段信息 -->
      <div class="current-segment-info" style="margin: 20px 0; padding: 20px; background: #f8f9fa; border-radius: 4px;">
        <h3 id="currentSegmentTitle">请选择片段</h3>
        <p id="currentSegmentText" class="segment-text-preview"></p>
        <p id="currentSegmentEmotion" class="segment-emotion-preview"></p>
      </div>

      <!-- 录制控制 -->
      <div class="recording-controls" style="margin: 20px 0;">
        <div class="recording-mode-selector" style="margin-bottom: 15px;">
          <label>录制模式：</label>
          <select id="recordingMode">
            <option value="replace">替换原有情感</option>
            <option value="enhance">增强原有情感</option>
          </select>
        </div>

        <div class="recording-interface" style="display: flex; flex-direction: column; gap: 15px;">
          <div>
            <button id="startRecordingBtn" class="btn btn-primary" disabled>
              🎤 开始录制 (90秒)
            </button>
            <button id="stopRecordingBtn" class="btn btn-danger" style="display: none;">
              ⏹ 停止录制
            </button>
          </div>

          <div id="recordingIndicator" class="recording-indicator" style="display: none; padding: 10px; background: #fff3cd; border-radius: 4px;">
            <span class="recording-dot" style="display: inline-block; width: 10px; height: 10px; background: red; border-radius: 50%; animation: pulse 1s infinite;"></span>
            <span class="recording-time" style="margin-left: 10px;">00:00</span>
            <span class="recording-max" style="margin-left: 5px;">/ 01:30</span>
          </div>

          <div id="audioPlayback" class="audio-playback-section" style="display: none;">
            <audio id="recordedAudio" controls style="width: 100%;"></audio>
            <div class="playback-actions" style="margin-top: 10px; display: flex; gap: 10px;">
              <button id="uploadAudioBtn" class="btn btn-success">💾 上传并保存</button>
              <button id="reRecordBtn" class="btn btn-warning">🔄 重新录制</button>
            </div>
          </div>
        </div>

        <div class="recording-tips" style="margin-top: 20px; padding: 10px; background: #d1ecf1; border-radius: 4px;">
          <p>💡 提示：录制时请保持环境安静，尽量用自然的语调表达情感。录制时长最多90秒。</p>
        </div>
      </div>

      <!-- 录制统计 -->
      <div class="recording-stats" style="margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 4px;">
        <span style="margin-right: 20px;">🎤 未录制: <span id="unrecordedCount">0</span></span>
        <span>✅ 已录制: <span id="recordedCount">0</span></span>
      </div>

      <!-- 批量录制 -->
      <div class="batch-controls" style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 4px;">
        <button id="batchRecordBtn" class="btn btn-info">🎬 批量录制模式</button>
        <button id="exportProgressBtn" class="btn btn-success">📊 导出录制报告</button>
      </div>
    </section>
    </div>
    <aside class="chapter-nav" id="chapterNav">
      <h3>章节切换</h3>
      <div class="chapter-nav-list" id="chapterNavList"></div>
    </aside>
  </main>

  <div id="browserModal" class="modal hidden">
    <div class="modal-content">
      <header>
        <h3 id="browserTitle">浏览</h3>
        <button id="browserClose">×</button>
      </header>
      <div class="browser-toolbar">
        <span id="browserPath"></span>
        <button id="browserUp" class="secondary">上一级</button>
      </div>
      <ul id="browserList"></ul>
      <footer>
        <button id="browserCancel" class="secondary">取消</button>
        <button id="browserSelect" class="primary" disabled>选择</button>
      </footer>
    </div>
  </div>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <script>window.__workspaceRoot = "";</script>
  <script src="/ui/emotion-recording.js"></script>
</body>
</html>
